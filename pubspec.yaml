name: namaz_app
description: "Takva Yolum - Namaz ve Maneviyat Takip Uygulaması"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.70.0
  url_launcher: ^6.2.0
  package_info_plus: ^9.0.0
  http: ^1.1.0
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  geocoding: ^4.0.0
  provider: ^6.1.5+1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  share_plus: ^10.1.3
  quran: ^1.4.1
  flutter_qiblah: ^3.2.0
  flutter_compass_v2: ^1.0.3
  video_player: ^2.8.2
  audioplayers: ^6.6.0
  sensors_plus: ^6.1.1
  vibration: ^3.1.8
  sound_mode: ^3.1.1
  firebase_core: ^3.12.1
  firebase_auth: ^5.6.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.5
  google_sign_in: ^6.2.2
  sqflite: ^2.4.2+1
  path: ^1.9.1
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  file_picker: ^8.3.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true
  assets:
    - assets/videos/
    - assets/sounds/
    - assets/images/
    - assets/images/streak_icon.png
    - assets/images/app_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

